
services:
  airflow-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: telemetry-airflow-dbt:local
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}
      TELEMETRY_DB_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      bash -c "airflow db migrate &&
      (airflow users create
      --username "$$AIRFLOW_ADMIN_USERNAME"
      --password "$$AIRFLOW_ADMIN_PASSWORD"
      --firstname Local
      --lastname Admin
      --role Admin
      --email "$$AIRFLOW_ADMIN_EMAIL" || true) &&
      airflow webserver"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ../telemetry_analytics:/opt/airflow/telemetry_analytics
      - ./dbt_profiles:/opt/airflow/dbt_profiles:ro
    networks:
      - default
      - telemetry_network
    restart: unless-stopped


  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: telemetry-airflow-dbt:local
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__FERNET_KEY: ""
      TELEMETRY_DB_PASSWORD: ${POSTGRES_PASSWORD}
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ../telemetry_analytics:/opt/airflow/telemetry_analytics
      - ./dbt_profiles:/opt/airflow/dbt_profiles:ro
    networks:
      - default
      - telemetry_network
    restart: unless-stopped

volumes:
  airflow_db_data:

networks:
  telemetry_network:
    external: true
    name: automotivetelemetrydataplatform_default
